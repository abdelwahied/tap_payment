tap_payment.settings:
  type: config_object
  label: 'Tap Payment settings'
  mapping:
    environment:
      type: string
      label: 'Environment'
      constraints:
        Choice:
          choices:
            - sandbox
            - production
    sandbox_secret_key:
      type: string
      label: 'Sandbox secret key'
    live_secret_key:
      type: string
      label: 'Live secret key'
